name: Build Nexplay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -q -o ./*-fixed.zip
          cp -r Nexplay-main/. .

      - name: Write Start.io plugin and bridge files
        run: |
          mkdir -p native-ads/android www scripts
          cat > native-ads/android/NexplayAdsPlugin.java <<'EOF'
          package com.omstudio.nexplay;

          import android.app.Activity;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.VideoListener;
          import com.startapp.sdk.adsbase.adlisteners.AdDisplayListener;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;

          @CapacitorPlugin(name = "NexplayAds")
          public class NexplayAdsPlugin extends Plugin {
              private static final String TAG = "NEXPLAY-Ads";

              private static final String APP_ID = "210717033";
              private static final boolean TEST_ADS = false;

              private static final long LOAD_TIMEOUT_MS = 30000;
              private static final long CLOSE_GRACE_MS = 1500;

              private final Handler handler = new Handler(Looper.getMainLooper());

              private boolean sdkReady = false;
              private PluginCall pendingCall;
              private StartAppAd currentAd;
              private boolean rewardReceived = false;
              private Runnable loadTimeout;
              private Runnable closeFallback;
              private String lastReason = "";

              @Override
              public void load() {
                  handler.post(this::initSdk);
              }

              private void initSdk() {
                  if (sdkReady) return;
                  try {
                      StartAppSDK.setTestAdsEnabled(TEST_ADS);
                      StartAppSDK.init(getContext(), APP_ID, false);
                      sdkReady = true;
                      Log.i(TAG, "Start.io initialized.");
                  } catch (Throwable t) {
                      lastReason = "init: " + t.getMessage();
                      Log.e(TAG, "Start.io init failed", t);
                  }
              }

              @PluginMethod
              public void showRewarded(PluginCall call) {
                  handler.post(() -> {
                      if (pendingCall != null) {
                          resolve(call, false);
                          return;
                      }
                      initSdk();
                      Activity activity = getActivity();
                      if (!sdkReady || activity == null) {
                          if (lastReason.isEmpty()) lastReason = "SDK hazir degil";
                          resolve(call, false);
                          return;
                      }

                      pendingCall = call;
                      rewardReceived = false;
                      lastReason = "";

                      cancel(loadTimeout);
                      loadTimeout = () -> {
                          if (pendingCall != null) {
                              lastReason = "yukleme zaman asimi";
                              finishRequest(false);
                          }
                      };
                      handler.postDelayed(loadTimeout, LOAD_TIMEOUT_MS);

                      final StartAppAd ad = new StartAppAd(activity);
                      currentAd = ad;

                      ad.setVideoListener(new VideoListener() {
                          @Override
                          public void onVideoCompleted() {
                              handler.post(() -> {
                                  rewardReceived = true;
                                  Log.i(TAG, "Rewarded video completed.");
                                  finishRequest(true);
                              });
                          }
                      });

                      ad.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                          @Override
                          public void onReceiveAd(Ad received) {
                              handler.post(() -> {
                                  if (pendingCall == null || currentAd != ad) return;
                                  Log.i(TAG, "Rewarded video loaded.");
                                  showAd(ad);
                              });
                          }

                          @Override
                          public void onFailedToReceiveAd(Ad failed) {
                              handler.post(() -> {
                                  String msg = failed != null ? failed.getErrorMessage() : null;
                                  lastReason = "load: " + (msg == null ? "reklam yok" : msg);
                                  Log.e(TAG, "Rewarded video load failed: " + lastReason);
                                  if (pendingCall != null && currentAd == ad) finishRequest(false);
                              });
                          }
                      });
                  });
              }

              private void showAd(StartAppAd ad) {
                  try {
                      ad.showAd(new AdDisplayListener() {
                          @Override
                          public void adHidden(Ad shown) {
                              handler.post(() -> {
                                  if (pendingCall != null && !rewardReceived) {
                                      cancel(closeFallback);
                                      closeFallback = () -> {
                                          if (pendingCall != null && !rewardReceived) {
                                              lastReason = "reklam kapatildi, odul yok";
                                              finishRequest(false);
                                          }
                                      };
                                      handler.postDelayed(closeFallback, CLOSE_GRACE_MS);
                                  }
                              });
                          }

                          @Override
                          public void adDisplayed(Ad shown) {
                              handler.post(() -> cancel(loadTimeout));
                          }

                          @Override
                          public void adClicked(Ad shown) { }

                          @Override
                          public void adNotDisplayed(Ad shown) {
                              handler.post(() -> {
                                  lastReason = "reklam gosterilemedi";
                                  if (pendingCall != null) finishRequest(false);
                              });
                          }
                      });
                  } catch (Throwable t) {
                      lastReason = "show: " + t.getMessage();
                      Log.e(TAG, "Could not show rewarded video", t);
                      finishRequest(false);
                  }
              }

              private void finishRequest(boolean rewarded) {
                  PluginCall call = pendingCall;
                  if (call == null) return;
                  pendingCall = null;
                  currentAd = null;
                  cancel(loadTimeout);
                  cancel(closeFallback);
                  loadTimeout = null;
                  closeFallback = null;
                  resolve(call, rewarded);
              }

              private void resolve(PluginCall call, boolean rewarded) {
                  JSObject result = new JSObject();
                  result.put("rewarded", rewarded);
                  result.put("reason", rewarded ? "" : lastReason);
                  call.resolve(result);
              }

              private void cancel(Runnable runnable) {
                  if (runnable != null) handler.removeCallbacks(runnable);
              }
          }
          EOF
          cat > scripts/prepare-android.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const SDK_DEPENDENCY = 'com.startapp:inapp-sdk:5.+';
          const START_APP_ID = '210717033';

          const root = process.cwd();
          const androidDir = path.join(root, 'android');
          const javaRoot = path.join(androidDir, 'app', 'src', 'main', 'java');

          if (!fs.existsSync(javaRoot)) {
            throw new Error('Android project not found. Run "npx cap add android" first.');
          }

          function findFile(dir, filename) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const found = findFile(full, filename);
                if (found) return found;
              } else if (entry.name === filename) {
                return full;
              }
            }
            return null;
          }

          const activityPath = findFile(javaRoot, 'MainActivity.java');
          if (!activityPath) throw new Error('Capacitor MainActivity.java not found.');
          const packageDir = path.dirname(activityPath);

          const gradleGroovy = path.join(androidDir, 'app', 'build.gradle');
          const gradleKts = path.join(androidDir, 'app', 'build.gradle.kts');
          const gradlePath = fs.existsSync(gradleGroovy) ? gradleGroovy : gradleKts;
          if (!fs.existsSync(gradlePath)) throw new Error('Android app Gradle file not found.');

          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const isKts = gradlePath.endsWith('.kts');
          const dependency = isKts
            ? `implementation("${SDK_DEPENDENCY}")`
            : `implementation '${SDK_DEPENDENCY}'`;

          if (!gradle.includes('com.startapp:inapp-sdk')) {
            const idx = gradle.lastIndexOf('dependencies {');
            if (idx >= 0) {
              const at = idx + 'dependencies {'.length;
              gradle = gradle.slice(0, at) + `\n    ${dependency}` + gradle.slice(at);
            } else {
              gradle += `\n\ndependencies {\n    ${dependency}\n}\n`;
            }
            fs.writeFileSync(gradlePath, gradle);
            console.log('Added Start.io dependency.');
          }

          const manifestPath = path.join(androidDir, 'app', 'src', 'main', 'AndroidManifest.xml');
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            const perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'com.google.android.gms.permission.AD_ID'
            ];
            let changed = false;
            for (const perm of perms) {
              if (!manifest.includes(`"${perm}"`)) {
                manifest = manifest.replace(
                  /<\/manifest>/,
                  `    <uses-permission android:name="${perm}" />\n</manifest>`
                );
                changed = true;
              }
            }
            if (!manifest.includes('com.startapp.sdk.APPLICATION_ID')) {
              manifest = manifest.replace(
                /(<application\b[^>]*>)/,
                `$1\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="${START_APP_ID}" />`
              );
              changed = true;
            }
            if (changed) fs.writeFileSync(manifestPath, manifest);
          }

          const pluginSource = path.join(root, 'native-ads', 'android', 'NexplayAdsPlugin.java');
          if (!fs.existsSync(pluginSource)) {
            throw new Error('Missing native-ads/android/NexplayAdsPlugin.java');
          }
          const pkgMatch = fs.readFileSync(activityPath, 'utf8').match(/^\s*package\s+([\w.]+)\s*;/m);
          if (!pkgMatch) throw new Error('Could not read MainActivity package name.');
          let pluginCode = fs.readFileSync(pluginSource, 'utf8')
            .replace(/^\s*package\s+[\w.]+\s*;/m, `package ${pkgMatch[1]};`);
          fs.writeFileSync(path.join(packageDir, 'NexplayAdsPlugin.java'), pluginCode);

          let activity = fs.readFileSync(activityPath, 'utf8');
          if (!activity.includes('NexplayAdsPlugin.class')) {
            const classPattern = /(public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{)/;
            if (!classPattern.test(activity)) {
              throw new Error('Could not safely find MainActivity extends BridgeActivity.');
            }
            activity = activity.replace(
              classPattern,
              `$1\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(NexplayAdsPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n`
            );
            fs.writeFileSync(activityPath, activity);
          }

          console.log('NEXPLAY Start.io plugin copied and registered.');
          EOF
          cat > www/nexplay-capacitor.js <<'EOF'
          (function () {
            "use strict";

            const JS_TIMEOUT_MS = 180000;

            function getPlugin() {
              const cap = window.Capacitor;
              if (!cap || typeof cap.isNativePlatform !== "function" || !cap.isNativePlatform()) {
                return null;
              }
              if (cap.Plugins && cap.Plugins.NexplayAds) return cap.Plugins.NexplayAds;
              if (typeof cap.registerPlugin === "function") return cap.registerPlugin("NexplayAds");
              return null;
            }

            window.NEX_AD = {
              show(callback) {
                let finished = false;
                let timer = null;
                const finish = (earned, reason) => {
                  if (finished) return;
                  finished = true;
                  clearTimeout(timer);
                  if (typeof callback === "function") callback(earned === true);
                  if (earned !== true && reason && typeof window.toast === "function") {
                    setTimeout(() => window.toast("Reklam hatası: " + reason), 2500);
                  }
                };

                const plugin = getPlugin();
                if (!plugin || typeof plugin.showRewarded !== "function") {
                  console.warn("[NEXPLAY] Native ads plugin is unavailable.");
                  finish(false, "eklenti yok");
                  return;
                }

                timer = setTimeout(() => finish(false, "JS zaman asimi"), JS_TIMEOUT_MS);
                plugin.showRewarded()
                  .then(result => finish(!!(result && result.rewarded === true), result && result.reason))
                  .catch(error => {
                    console.error("[NEXPLAY] Rewarded ad error:", error);
                    finish(false, String((error && error.message) || error));
                  });
              }
            };
          })();
          EOF
          grep -q StartAppSDK native-ads/android/NexplayAdsPlugin.java && echo "PLUGIN START.IO YENI"
          grep -q startapp scripts/prepare-android.mjs && echo "PREPARE YENI"
          grep -q "eklenti yok" www/nexplay-capacitor.js && echo "JS YENI"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets and inject ads plugin
        run: npm run build:android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXPLAY-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
