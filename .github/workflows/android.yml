name: Build Nexplay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -q -o ./*-fixed.zip
          cp -r Nexplay-main/. .

      - name: Write updated plugin and bridge files
        run: |
          mkdir -p native-ads/android www
          cat > native-ads/android/NexplayAdsPlugin.java <<'EOF'
          package com.omstudio.nexplay;

          import android.app.Activity;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;

          import androidx.annotation.NonNull;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.unity3d.mediation.LevelPlay;
          import com.unity3d.mediation.LevelPlayAdError;
          import com.unity3d.mediation.LevelPlayAdInfo;
          import com.unity3d.mediation.LevelPlayConfiguration;
          import com.unity3d.mediation.LevelPlayInitError;
          import com.unity3d.mediation.LevelPlayInitListener;
          import com.unity3d.mediation.LevelPlayInitRequest;
          import com.unity3d.mediation.rewarded.LevelPlayReward;
          import com.unity3d.mediation.rewarded.LevelPlayRewardedAd;
          import com.unity3d.mediation.rewarded.LevelPlayRewardedAdListener;

          /**
           * NEXPLAY Capacitor bridge for Unity LevelPlay rewarded ads.
           * The game receives a reward only after LevelPlay calls onAdRewarded.
           *
           * All state is touched on the main thread only (Capacitor calls plugin methods
           * on its own thread, so showRewarded() hops to the main looper first).
           */
          @CapacitorPlugin(name = "NexplayAds")
          public class NexplayAdsPlugin extends Plugin {
              private static final String TAG = "NEXPLAY-Ads";

              // LevelPlay dashboard values (App Key + Rewarded Ad Unit ID).
              private static final String APP_KEY = "29b6a262d";
              private static final String REWARDED_AD_UNIT_ID = "41n8w7vfzpf05dib";

              private static final long REQUEST_TIMEOUT_MS = 45000;   // wait for load + show
              private static final long CLOSE_GRACE_MS = 3000;        // onAdRewarded may come after onAdClosed
              private static final long INIT_RETRY_MS = 15000;

              private final Handler handler = new Handler(Looper.getMainLooper());

              private boolean sdkReady = false;
              private boolean initializing = false;
              private boolean loading = false;
              private boolean adClosed = false;
              private boolean rewardReceived = false;

              private LevelPlayRewardedAd rewardedAd;
              private PluginCall pendingCall;
              private Runnable closeFallback;
              private Runnable requestTimeout;
              private String lastReason = "";

              @Override
              public void load() {
                  handler.post(this::initSdk);
              }

              // ------------------------------------------------------------------ init

              private void initSdk() {
                  if (sdkReady || initializing) return;
                  initializing = true;

                  LevelPlayInitRequest request = new LevelPlayInitRequest.Builder(APP_KEY).build();
                  LevelPlay.init(getContext(), request, new LevelPlayInitListener() {
                      @Override
                      public void onInitSuccess(@NonNull LevelPlayConfiguration configuration) {
                          handler.post(() -> {
                              initializing = false;
                              sdkReady = true;
                              Log.i(TAG, "LevelPlay initialized.");
                              createRewardedAd();
                              if (pendingCall != null) loadNextAd();
                          });
                      }

                      @Override
                      public void onInitFailed(@NonNull LevelPlayInitError error) {
                          handler.post(() -> {
                              initializing = false;
                              sdkReady = false;
                              lastReason = "init " + error.getErrorCode() + ": " + error.getErrorMessage();
                              Log.e(TAG, "LevelPlay init failed: " + lastReason);
                              if (pendingCall != null) finishRequest(false);
                              handler.postDelayed(NexplayAdsPlugin.this::initSdk, INIT_RETRY_MS);
                          });
                      }
                  });
              }

              private void createRewardedAd() {
                  if (rewardedAd != null) return;
                  rewardedAd = new LevelPlayRewardedAd(REWARDED_AD_UNIT_ID);
                  rewardedAd.setListener(new LevelPlayRewardedAdListener() {
                      @Override
                      public void onAdLoaded(@NonNull LevelPlayAdInfo adInfo) {
                          handler.post(() -> {
                              loading = false;
                              Log.i(TAG, "Rewarded ad loaded.");
                              if (pendingCall != null && !adClosed) showLoadedAd();
                          });
                      }

                      @Override
                      public void onAdLoadFailed(@NonNull LevelPlayAdError error) {
                          handler.post(() -> {
                              loading = false;
                              lastReason = "load " + error.getErrorCode() + ": " + error.getErrorMessage();
                              Log.e(TAG, "Rewarded load failed: " + lastReason);
                              if (pendingCall != null) finishRequest(false);
                          });
                      }

                      @Override
                      public void onAdDisplayed(@NonNull LevelPlayAdInfo adInfo) {
                          Log.i(TAG, "Rewarded ad displayed.");
                          // The ad is on screen: the user may watch it as long as needed.
                          handler.post(() -> cancel(requestTimeout));
                      }

                      @Override
                      public void onAdDisplayFailed(@NonNull LevelPlayAdError error,
                                                    @NonNull LevelPlayAdInfo adInfo) {
                          handler.post(() -> {
                              lastReason = "show " + error.getErrorCode() + ": " + error.getErrorMessage();
                              Log.e(TAG, "Rewarded display failed: " + lastReason);
                              finishRequest(false);
                              loadNextAd();
                          });
                      }

                      @Override
                      public void onAdRewarded(@NonNull LevelPlayReward reward,
                                               @NonNull LevelPlayAdInfo adInfo) {
                          handler.post(() -> {
                              rewardReceived = true;
                              Log.i(TAG, "Reward received: " + reward.getName() + " x" + reward.getAmount());
                              finishRequest(true);
                          });
                      }

                      @Override
                      public void onAdClosed(@NonNull LevelPlayAdInfo adInfo) {
                          handler.post(() -> {
                              adClosed = true;
                              // onAdRewarded can arrive after onAdClosed, so wait a moment before failing.
                              if (!rewardReceived && pendingCall != null) {
                                  cancel(closeFallback);
                                  closeFallback = () -> {
                                      if (pendingCall != null && !rewardReceived) {
                                          lastReason = "reklam kapatildi, odul yok";
                                          finishRequest(false);
                                      }
                                  };
                                  handler.postDelayed(closeFallback, CLOSE_GRACE_MS);
                              }
                              loadNextAd();
                          });
                      }

                      @Override
                      public void onAdClicked(@NonNull LevelPlayAdInfo adInfo) { }

                      @Override
                      public void onAdInfoChanged(@NonNull LevelPlayAdInfo adInfo) { }
                  });

                  loadNextAd();
              }

              // ------------------------------------------------------------ plugin API

              @PluginMethod
              public void showRewarded(PluginCall call) {
                  handler.post(() -> {
                      if (pendingCall != null) {          // another request is already running
                          resolve(call, false);
                          return;
                      }
                      if (!sdkReady || rewardedAd == null) {
                          if (lastReason.isEmpty()) lastReason = "SDK hazir degil";
                          initSdk();                      // retry in the background for next time
                          resolve(call, false);
                          return;
                      }

                      pendingCall = call;
                      lastReason = "";
                      adClosed = false;
                      rewardReceived = false;

                      cancel(requestTimeout);
                      requestTimeout = () -> {
                          if (pendingCall != null) {
                              if (lastReason.isEmpty()) lastReason = "zaman asimi";
                              finishRequest(false);
                          }
                      };
                      handler.postDelayed(requestTimeout, REQUEST_TIMEOUT_MS);

                      if (rewardedAd.isAdReady()) {
                          showLoadedAd();
                      } else {
                          loadNextAd();
                      }
                  });
              }

              // --------------------------------------------------------------- helpers

              private void showLoadedAd() {
                  Activity activity = getActivity();
                  if (activity == null || pendingCall == null || adClosed) return;
                  if (!rewardedAd.isAdReady()) {
                      loadNextAd();
                      return;
                  }
                  try {
                      rewardedAd.showAd(activity);
                  } catch (Exception error) {
                      Log.e(TAG, "Could not show rewarded ad.", error);
                      finishRequest(false);
                      loadNextAd();
                  }
              }

              private void loadNextAd() {
                  if (!sdkReady || rewardedAd == null || loading || rewardedAd.isAdReady()) return;
                  loading = true;
                  rewardedAd.loadAd();
              }

              private void finishRequest(boolean rewarded) {
                  PluginCall call = pendingCall;
                  if (call == null) return;
                  pendingCall = null;
                  cancel(closeFallback);
                  cancel(requestTimeout);
                  closeFallback = null;
                  requestTimeout = null;
                  resolve(call, rewarded);
              }

              private void resolve(PluginCall call, boolean rewarded) {
                  JSObject result = new JSObject();
                  result.put("rewarded", rewarded);
                  result.put("reason", rewarded ? "" : lastReason);
                  call.resolve(result);
              }

              private void cancel(Runnable runnable) {
                  if (runnable != null) handler.removeCallbacks(runnable);
              }
          }
          EOF
          cat > www/nexplay-capacitor.js <<'EOF'
          /*
           * NEXPLAY JavaScript bridge for the native Capacitor "NexplayAds" plugin
           * (Unity LevelPlay rewarded ads).
           * The game grants rewards only when the native SDK returns rewarded: true.
           */
          (function () {
            "use strict";

            const JS_TIMEOUT_MS = 180000; // safety net: never leave the game waiting forever

            function getPlugin() {
              const cap = window.Capacitor;
              if (!cap || typeof cap.isNativePlatform !== "function" || !cap.isNativePlatform()) {
                return null;
              }
              if (cap.Plugins && cap.Plugins.NexplayAds) return cap.Plugins.NexplayAds;
              if (typeof cap.registerPlugin === "function") return cap.registerPlugin("NexplayAds");
              return null;
            }

            window.NEX_AD = {
              show(callback) {
                let finished = false;
                let timer = null;
                const finish = (earned, reason) => {
                  if (finished) return;
                  finished = true;
                  clearTimeout(timer);
                  if (typeof callback === "function") callback(earned === true);
                  if (earned !== true && reason && typeof window.toast === "function") {
                    setTimeout(() => window.toast("Reklam hatası: " + reason), 2500);
                  }
                };

                const plugin = getPlugin();
                if (!plugin || typeof plugin.showRewarded !== "function") {
                  console.warn("[NEXPLAY] Native ads plugin is unavailable (not running in the Android app?).");
                  finish(false, "eklenti yok");
                  return;
                }

                timer = setTimeout(() => finish(false, "JS zaman asimi"), JS_TIMEOUT_MS);
                plugin.showRewarded()
                  .then(result => finish(!!(result && result.rewarded === true), result && result.reason))
                  .catch(error => {
                    console.error("[NEXPLAY] Rewarded ad error:", error);
                    finish(false, String((error && error.message) || error));
                  });
              }
            };
          })();
          EOF
          grep -q lastReason native-ads/android/NexplayAdsPlugin.java && echo "PLUGIN YENI"
          grep -q "eklenti yok" www/nexplay-capacitor.js && echo "JS YENI"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets and inject ads plugin
        run: npm run build:android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXPLAY-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
