name: Build Nexplay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -q -o ./*-fixed.zip
          cp -rn Nexplay-main/. .

      - name: Verify updated files
        run: |
          ls -la native-ads/android www
          grep -q lastReason native-ads/android/NexplayAdsPlugin.java && echo "PLUGIN YENI" || { echo "PLUGIN ESKI veya YOK"; exit 1; }
          grep -q "eklenti yok" www/nexplay-capacitor.js && echo "JS YENI" || { echo "JS ESKI veya YOK"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets and inject ads plugin
        run: npm run build:android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXPLAY-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
