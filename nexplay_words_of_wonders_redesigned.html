<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#eef1fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NEXPLAY"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>NEXPLAY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:light;--bg:#eef1fb;--t:#0b0b1c;--m:rgba(52,56,88,.62);--blue:#0a7aff;--c:#0a7aff;--p:#9b4dee;--g:#27c24e;--pk:#ff375f;--or:#ff9f0a;
--s:rgba(255,255,255,.56);--s2:rgba(110,118,165,.16);--ln:rgba(60,64,110,.14);--bar:rgba(255,255,255,.58);--gb:rgba(255,255,255,.8);
--gsh:0 12px 40px rgba(60,72,170,.17);--ghi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3);--gbg:#eef1fb;
--b1:#7cc8ff;--b2:#d2a0ff;--b3:#ffb4ca;--b4:#98f2d4;--br:linear-gradient(110deg,#22d3ee,#0a84ff 34%,#a855f7 68%,#ff375f)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#05040c;--t:#fff;--m:rgba(235,235,255,.6);--blue:#0a84ff;--c:#52acff;--p:#c47dff;--g:#30d158;--s:rgba(255,255,255,.075);--s2:rgba(255,255,255,.13);--ln:rgba(255,255,255,.12);--bar:rgba(30,26,56,.52);--gb:rgba(255,255,255,.2);--gsh:0 16px 48px rgba(0,0,0,.55);--ghi:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.03);--gbg:#07050f;--b1:#1c4fd6;--b2:#7e2fd6;--b3:#c5327c;--b4:#0e918c}}
:root[data-theme=dark]{color-scheme:dark;--bg:#05040c;--t:#fff;--m:rgba(235,235,255,.6);--blue:#0a84ff;--c:#52acff;--p:#c47dff;--g:#30d158;--s:rgba(255,255,255,.075);--s2:rgba(255,255,255,.13);--ln:rgba(255,255,255,.12);--bar:rgba(30,26,56,.52);--gb:rgba(255,255,255,.2);--gsh:0 16px 48px rgba(0,0,0,.55);--ghi:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.03);--gbg:#07050f;--b1:#1c4fd6;--b2:#7e2fd6;--b3:#c5327c;--b4:#0e918c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--t);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{color:inherit;cursor:pointer}
/* aurora arka plan */
#aur{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#aur i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;opacity:.85;will-change:transform}
#aur i:nth-child(1){left:-30vmax;top:-26vmax;background:radial-gradient(circle,var(--b1),transparent 66%);animation:d1 24s ease-in-out infinite alternate}
#aur i:nth-child(2){right:-34vmax;top:-12vmax;background:radial-gradient(circle,var(--b2),transparent 66%);animation:d2 29s ease-in-out infinite alternate}
#aur i:nth-child(3){right:-26vmax;bottom:-34vmax;background:radial-gradient(circle,var(--b3),transparent 66%);animation:d3 26s ease-in-out infinite alternate}
#aur i:nth-child(4){left:-34vmax;bottom:-28vmax;background:radial-gradient(circle,var(--b4),transparent 66%);animation:d1 31s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}@keyframes d2{to{transform:translate3d(-16vmax,14vmax,0) scale(.9)}}@keyframes d3{to{transform:translate3d(-12vmax,-14vmax,0) scale(1.2)}}
body::after{content:"";position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{height:100%;max-width:520px;margin:auto;position:relative;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:transparent}
#v{flex:1;overflow:auto;padding:12px 16px 26px;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}#v::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
#v>*{animation:rise .65s cubic-bezier(.2,.85,.2,1) backwards;animation-delay:calc(var(--i,0)*65ms)}#v.na>*{animation:none}
h2,h3,p{margin:0}h2{font-size:34px;font-weight:800;letter-spacing:-.6px;margin-bottom:16px}h3{font-size:17px;font-weight:650}.mut{color:var(--m);font-size:13px}
img{display:block;-webkit-user-drag:none}
.i{display:inline-block;width:24px;height:24px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;flex:none}
img.i{background:none;width:28px;height:28px}
/* cam yüzey */
.card,.tab,#nv,#toast{-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
.card{position:relative;background:var(--s);border:1px solid var(--gb);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:var(--gsh),var(--ghi);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.26),transparent 62%);opacity:0;transition:opacity .35s}
.card:hover::before,.card.hl::before{opacity:1}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,0) 36%)}
.card>*{position:relative;z-index:1}
/* nav */
#nv{position:relative;display:none;margin:0 14px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:36px;background:var(--bar);border:1px solid var(--gb);box-shadow:var(--gsh),var(--ghi);z-index:3}
#nv::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:28px;background:linear-gradient(135deg,rgba(10,132,255,.32),rgba(168,85,247,.28));border:1px solid var(--gb);box-shadow:var(--ghi),0 6px 20px rgba(10,132,255,.25);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.45,.5,1)}
#nv button{position:relative;z-index:1;flex:1;background:none;border:0;color:var(--m);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;transition:color .25s,transform .2s}
#nv button:active{transform:scale(.88)}#nv .on{color:var(--t)}#nv .on .i{color:var(--c);filter:drop-shadow(0 0 8px var(--c))}
#nv .i{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}#nv .on .i{transform:translateY(-1px) scale(1.12)}
/* butonlar */
.btn{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),linear-gradient(135deg,#0a84ff,#6a5cff 62%,#b25cf5);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:14px 24px;font-weight:700;font-size:17px;letter-spacing:.2px;transition:transform .15s,filter .2s;display:inline-flex;align-items:center;gap:9px;justify-content:center;box-shadow:0 10px 26px rgba(90,92,255,.42),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:scale(.95);filter:brightness(1.1)}.btn.sm{padding:10px 18px;font-size:15px}.btn.big{width:100%;padding:17px;font-size:18px}
.btn.big::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-80px}100%{left:120%}}
.btn.gh{background:var(--s);color:var(--c);border:1px solid var(--gb);box-shadow:var(--gsh),var(--ghi);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.btn.dg{background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 55%),linear-gradient(135deg,#ff453a,#ff375f);box-shadow:0 8px 22px rgba(255,55,95,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.ib{background:var(--s);border:1px solid var(--gb);color:var(--c);width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;box-shadow:var(--ghi);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .15s}.ib:active{transform:scale(.88)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h2{margin:0}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.who{display:flex;gap:14px;align-items:center}.nm{font-size:22px;font-weight:750;letter-spacing:-.3px}
/* avatar halkası */
.ring{position:relative;display:block;width:var(--sz,48px);height:var(--sz,48px);flex:none;border-radius:50%}
.ring::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#22d3ee,#a855f7,#ff375f,#ffd60a,#22d3ee);animation:spin 5s linear infinite;filter:saturate(1.3)}
.ring img{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--bg)}
@keyframes spin{to{transform:rotate(1turn)}}
/* inputlar */
.fld{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--ln);border-radius:18px;padding:0 14px;margin:8px 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.1);transition:border-color .25s,box-shadow .25s}
.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,.2),inset 0 2px 6px rgba(0,0,0,.08)}
.fld svg,.fld .i{width:20px;height:20px;color:var(--m);flex:none}.fld svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=email],input[type=password]{width:100%;background:none;border:0;padding:15px 0;color:var(--t);font-size:17px;outline:0;user-select:text;-webkit-user-select:text;min-width:0}
input::placeholder{color:var(--m)}
.eye{background:none;border:0;padding:4px;color:var(--m);display:flex}
.pwm{display:flex;gap:5px;margin:2px 4px 4px}.pwm i{flex:1;height:4px;border-radius:4px;background:var(--s2);transition:background .3s}
.err{color:#ff453a;min-height:20px;font-size:13px;margin:6px 2px 8px}
/* logo */
.logo{font-weight:900;letter-spacing:.32em;margin-right:-.32em;text-align:center;line-height:1;font-size:34px;background:var(--br);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shim 5s linear infinite,lg 1.2s cubic-bezier(.2,.8,.2,1) backwards;filter:drop-shadow(0 4px 22px rgba(120,90,255,.45))}
.logo.xl{font-size:46px}
@keyframes shim{to{background-position:-220% 0}}@keyframes lg{from{letter-spacing:.9em;opacity:0;filter:blur(12px)}}
.tag{text-align:center;margin-top:10px;letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:var(--m);font-weight:600}
.hero{text-align:center;margin:20px 0 22px}.emb{width:92px;height:92px;margin:0 auto 18px;display:block;overflow:visible;filter:drop-shadow(0 6px 24px rgba(120,90,255,.6));animation:flt 5s ease-in-out infinite}
.emb.big{width:128px;height:128px}
.emb .hx{fill:rgba(255,255,255,.06);stroke:url(#gr);stroke-width:3.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1.4s ease-out backwards}
.emb .nn{fill:none;stroke:url(#gr);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:dr 1.2s .5s ease-out backwards}
@keyframes dr{from{stroke-dashoffset:1}}@keyframes flt{50%{transform:translateY(-8px)}}
.splash{margin-top:24vh;text-align:center}
.bar{height:5px;border-radius:5px;background:var(--s2);overflow:hidden;width:46%;margin:28px auto 0}.bar i{display:block;height:100%;width:0;background:var(--br);animation:ld 1.1s .2s cubic-bezier(.5,0,.2,1) forwards}@keyframes ld{to{width:100%}}
/* ana sayfa */
.hero2{display:flex;align-items:center;gap:18px;padding:18px 20px}
.lvr{position:relative;width:92px;height:92px;flex:none}.lvr svg{width:100%;height:100%;transform:rotate(-90deg)}
.lvr circle{fill:none;stroke-width:7;stroke-linecap:round}.lvr .tr{stroke:var(--s2)}
.lvr .pg2{stroke:url(#gr);stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1.4s .3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(120,90,255,.7))}.lvr .pg2.go{stroke-dashoffset:var(--o)}
.lvn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.lvn small{font-size:9px;letter-spacing:1.5px;color:var(--m);font-weight:700}.lvn b{font-size:30px;font-weight:800;line-height:1}
.hs{flex:1;min-width:0}.hs .big{font-size:44px;font-weight:850;letter-spacing:-1.5px;line-height:1;background:var(--br);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.hs small{font-size:11px;letter-spacing:2px;color:var(--m);font-weight:700}
.chips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:4px 10px 4px 7px;font-size:12px;font-weight:650}.chip .i{width:15px;height:15px}
.xpb{height:7px;border-radius:7px;background:var(--s2);overflow:hidden;margin-top:12px}.xpb i{display:block;height:100%;width:0;border-radius:7px;background:var(--br);transition:width 1.2s .3s cubic-bezier(.2,.8,.2,1)}.xpb i.go{width:var(--w)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}.sec h3{font-size:20px;font-weight:750}
#car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding:6px calc(50% - 112px) 22px;margin:0 -16px;scrollbar-width:none;perspective:900px}#car::-webkit-scrollbar{display:none}
.gc{flex:0 0 224px;scroll-snap-align:center;text-align:center;padding:24px 16px 20px;border-radius:32px;margin:0;transition:transform .3s,opacity .3s,box-shadow .4s;background:linear-gradient(165deg,var(--gc2),rgba(255,255,255,.04)),var(--s)}
.gc.sel{box-shadow:0 0 0 1.5px var(--gc),0 22px 56px var(--gc2),var(--ghi)}
.gc .orb{position:relative;width:112px;height:112px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.gc .orb::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,var(--gc2),transparent 68%);animation:pls 3.6s ease-in-out infinite}
.gc img{position:relative;width:96px;height:96px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.3));animation:flt 4.5s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.18);opacity:.65}}
.gc p{min-height:34px;margin:5px 0 10px}.gc h3{font-size:19px}
.rec{display:inline-flex;gap:6px;align-items:center;background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--m)}.rec b{color:var(--t)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.duo .card{margin:0;padding:16px;cursor:pointer;transition:transform .15s}.duo .card:active{transform:scale(.96)}
.mini .mi{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:linear-gradient(135deg,rgba(255,159,10,.4),rgba(255,55,95,.35));border:1px solid var(--gb);box-shadow:var(--ghi)}
.mini.a .mi{background:linear-gradient(135deg,rgba(48,209,88,.4),rgba(10,132,255,.35))}
.mini b{font-size:17px;display:block}.mini small{color:var(--m);font-size:12px}
.mini .xpb{margin-top:10px;height:5px}
/* oyun listesi */
.gl{display:flex;gap:14px;align-items:center}.gl .gi{width:66px;height:66px;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}
/* liderlik */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:6px 0 16px}
.pd{text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}.pd .ring{margin-bottom:12px}
.pd b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.pd small{color:var(--m);font-size:12px;font-weight:700}
.pd .pl{width:100%;margin-top:8px;border-radius:20px 20px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-weight:850;font-size:26px;color:#fff;border:1px solid var(--gb);box-shadow:var(--ghi),var(--gsh);transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes grow{from{transform:scaleY(.1);opacity:0}}
.pd.g1 .pl{height:104px;background:linear-gradient(180deg,#ffe066,#ff9f0a);animation-delay:.15s}.pd.g2 .pl{height:78px;background:linear-gradient(180deg,#e5e7ee,#9aa3b8);animation-delay:.3s}.pd.g3 .pl{height:60px;background:linear-gradient(180deg,#f0b27a,#c06a2b);animation-delay:.45s}
.crown{width:26px;height:26px;color:#ffd60a;filter:drop-shadow(0 0 8px #ffd60a);margin-bottom:6px;animation:flt 3s ease-in-out infinite}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.rk:last-child{border:0}.rk .n{width:26px;text-align:center;font-weight:800;color:var(--m)}.rk .sc{margin-left:auto;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}.rk>div b{display:block}
.rk.me{background:linear-gradient(90deg,rgba(10,132,255,.22),rgba(168,85,247,.16));border:1px solid var(--gb);border-radius:18px;padding:10px 12px;margin:2px -6px;box-shadow:var(--ghi)}
.av{border-radius:50%;object-fit:cover}
.tab{display:flex;gap:2px;background:var(--s2);border:1px solid var(--ln);padding:3px;border-radius:16px;margin-bottom:16px}.tab button{flex:1;background:none;border:0;color:var(--m);padding:9px 0;border-radius:13px;font-weight:600;font-size:13px;transition:all .25s}
.tab .on{background:var(--s);color:var(--t);border:1px solid var(--gb);box-shadow:0 3px 10px rgba(0,0,0,.18),var(--ghi);font-weight:700}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:50px}.tg+.tg{border-top:1px solid var(--ln)}.tg .sp{margin-left:auto}
.ck{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--s2);border:1px solid var(--ln);color:var(--m)}.ck .i{width:16px;height:16px}
.ck.ok{background:linear-gradient(135deg,#30d158,#0a84ff);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 0 16px rgba(48,209,88,.5);animation:pop .5s}
.bdg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bd{border-radius:20px;padding:16px 10px;text-align:center;background:var(--s2);border:1px solid var(--ln);opacity:.5;filter:grayscale(.6)}
.bd.ok{opacity:1;filter:none;background:linear-gradient(160deg,rgba(255,214,10,.28),rgba(255,55,95,.18));border-color:var(--gb);box-shadow:var(--ghi),0 8px 24px rgba(255,159,10,.25)}.bd .i{width:30px;height:30px;margin-bottom:6px}.bd.ok .i{color:#ffd60a;filter:drop-shadow(0 0 8px #ffd60a)}.bd b{display:block;font-size:14px}
.tring{display:flex;align-items:center;gap:16px}.tring .lvr{width:76px;height:76px}.tring .lvn b{font-size:22px}
.stg{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}.stg b{font-size:24px;font-weight:800;display:block}.stg small{color:var(--m);font-size:11px;letter-spacing:.8px;font-weight:600}
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.pg img{width:100%;border-radius:50%;border:3px solid transparent;transition:.25s;cursor:pointer}.pg .on{border-color:var(--blue);transform:scale(1.12);box-shadow:0 0 18px rgba(10,132,255,.6)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:20px;background:var(--s2);border:1px solid var(--ln);position:relative;transition:.3s;margin:0;flex:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.14)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.3s cubic-bezier(.3,1.5,.5,1)}.sw:checked{background:var(--g);box-shadow:0 0 14px rgba(48,209,88,.45)}.sw:checked::after{left:22px}

/* ===== para sistemi ===== */
.coin{display:inline-block;width:var(--w,16px);height:var(--w,16px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2b630 55%,#c98512);box-shadow:inset 0 0 0 2px rgba(150,90,0,.35);flex:none;vertical-align:-3px}
.cpill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--s);border:1px solid var(--ln);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.cpill.sm{padding:6px 10px;font-size:14px}
.hcost{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:3px 8px;border-radius:999px;background:var(--s2);font-size:12.5px;font-weight:700;line-height:1}
.hcost .coin{vertical-align:0}
.whint{text-align:center;letter-spacing:.35em;font-weight:800;font-size:20px;margin:10px 0 0;color:var(--blue)}
.tr2{display:flex;align-items:center;gap:10px}
.gx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.gx>.ib{justify-self:start}.gx>:last-child{justify-self:end}.gx .cpill b{font-size:inherit}
.ovl{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);padding:16px}.ovl .card{width:100%;max-width:420px}

/* ===== v5: cila + reklam stili ===== */
:root{--m:rgba(40,48,76,.74)}
#nv button{font-size:11px;letter-spacing:.1px}
.cpill{position:relative;transition:transform .2s}
.cpill.bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.14)}}
.cpill .fl{position:absolute;right:8px;top:-8px;font-style:normal;font-size:12px;font-weight:850;color:#ffd60a;text-shadow:0 1px 8px rgba(0,0,0,.45);animation:flup .95s ease-out forwards;pointer-events:none}
@keyframes flup{to{transform:translateY(-24px);opacity:0}}
.hcost.poor,.hcost.poor b{color:var(--pk)}
.whint{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.whint i{font-style:normal;width:32px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border:1.5px dashed var(--ln);color:var(--blue);transition:background .25s,border-color .25s}
.whint i.k{border:1.5px solid var(--blue);background:rgba(10,132,255,.14);animation:pop .3s}
.tk{border-radius:14px;transition:background .2s}
.tk .btn.sm:active{transform:scale(.94)}
.card{transition:box-shadow .3s,transform .2s}
/* ödüllü reklam: teklif paneli */
@keyframes fadein{from{opacity:0}}
.ovl{animation:fadein .25s;align-items:flex-end}
.sheet{width:100%;max-width:440px;background:var(--gbg);border:1px solid var(--gb);border-radius:30px;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -10px 50px rgba(0,0,0,.28),var(--ghi);animation:up .38s cubic-bezier(.2,.85,.2,1)}
.sh-grab{width:40px;height:5px;border-radius:5px;background:var(--s2);margin:0 auto 18px}
.sh-ic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(255,159,10,.45),rgba(255,55,95,.35));border:1px solid var(--gb);box-shadow:var(--ghi),0 8px 24px rgba(255,159,10,.25)}
.sh-ic .i{width:30px;height:30px;color:#ffd60a}
.adl{display:flex;gap:7px;justify-content:center;margin:16px 0 18px}
.adl i{width:9px;height:9px;border-radius:50%;background:var(--s2);border:1px solid var(--ln)}.adl i.on{background:var(--c);border-color:transparent;box-shadow:0 0 8px var(--c)}
/* ödüllü reklam: oynatıcı */
#adp{position:absolute;inset:0;z-index:60;background:#07060f;color:#fff;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));animation:fadein .25s}
.adtop{display:flex;justify-content:space-between;align-items:center}
.adbadge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.adc{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.adc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.adc circle{fill:none;stroke-width:3}.adc .a0{stroke:rgba(255,255,255,.18)}
.adc .a1{stroke:#fff;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25}
#adp.go .a1{stroke-dashoffset:0;transition:stroke-dashoffset 5s linear}
.adc b{font-size:15px;font-variant-numeric:tabular-nums}
.adview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:18px 0;border-radius:26px;background:radial-gradient(circle at 50% 40%,rgba(120,100,255,.35),transparent 65%),rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.adlogo{font-weight:900;letter-spacing:.3em;margin-right:-.3em;font-size:30px;background:var(--br);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.adview p{opacity:.6;font-size:13px}
.adprog{height:4px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:14px}
.adprog i{display:block;height:100%;width:0;background:#fff;border-radius:4px}
#adp.go .adprog i{width:100%;transition:width 5s linear}
#adp .btn:disabled{opacity:.4;filter:grayscale(.5);pointer-events:none}

/* ===== bölünmüş ip ucu düğmesi ===== */
.hsplit{display:inline-flex;align-items:stretch;border-radius:999px;background:var(--s);border:1px solid var(--gb);box-shadow:var(--gsh),var(--ghi);overflow:hidden;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.hsplit button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:10px 16px;min-height:46px;font-size:14px;font-weight:650;color:var(--c);transition:background .15s}
.hsplit button+button{border-left:1px solid var(--ln)}
.hsplit button:active{background:var(--s2)}
.hsplit .i{width:18px;height:18px}
.hsplit .hcost{margin-left:0}
.hsplit .hs-r{color:var(--g)}
.hsplit .hs-r.soon{color:var(--m);opacity:.8}

/* ===== Words of Wonders: düzenli crossword ekranı ===== */
.wow-shell{display:flex;flex-direction:column;flex:1;min-height:0;margin:-12px -16px -12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--wow-bg);color:#fff;overflow:hidden;gap:8px}
.wow-head{flex:none;margin:0 0 2px;display:grid;grid-template-columns:48px 1fr 88px;gap:8px}
.wow-head .ib{background:rgba(12,15,40,.28);border-color:rgba(255,255,255,.22);color:#fff}
.wow-head .cpill{justify-self:end;background:rgba(12,15,40,.28);border-color:rgba(255,255,255,.22);color:#fff}
.wow-head-title{text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.wow-head-title b{font-size:17px;font-weight:800}
.wow-head-title small{font-size:11px;opacity:.78;margin-top:3px;letter-spacing:.7px}
.wow-progress{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:750;letter-spacing:.65px;opacity:.9;padding:0 4px;flex:none}
.wow-board-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 8px;border-radius:24px;background:rgba(12,15,40,.19);border:1px solid rgba(255,255,255,.19);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 28px rgba(0,0,0,.12)}
#ws{width:100%;display:flex;justify-content:center;align-items:center;min-height:0}
.wow-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;width:min(100%,350px,calc((100dvh - 460px)*var(--ratio)));margin:auto}
.wow-cell,.wow-blank{aspect-ratio:1;min-width:0;border-radius:7px}
.wow-cell{display:flex;align-items:center;justify-content:center;background:rgba(247,247,255,.88);border:1px solid rgba(255,255,255,.8);color:#fff;font-size:clamp(12px,4vw,22px);font-weight:850;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.wow-cell.revealed{background:linear-gradient(145deg,var(--wow-tile),color-mix(in srgb,var(--wow-tile),#24194c 25%));border-color:rgba(255,255,255,.4);box-shadow:0 3px 9px var(--wow-glow),inset 0 1px 0 rgba(255,255,255,.2)}
.wow-blank{background:transparent}
#cw{height:34px;min-height:34px;display:flex;align-items:center;justify-content:center;margin:5px 0 0;font-weight:800;font-size:17px;letter-spacing:2px}
#cw span{padding:5px 18px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);color:#fff}
#cw.bad span{background:rgba(255,65,95,.28)}
.wow-wheel-zone{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.wow-wheel-caption{font-size:10px;font-weight:800;letter-spacing:2px;opacity:.78}
#wh{width:250px;height:250px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.98),rgba(240,241,255,.88));border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 28px rgba(0,0,0,.2),inset 0 2px 8px rgba(255,255,255,.9);touch-action:none;flex:none}
#wh svg{width:100%;height:100%}
#wh .lt{width:clamp(42px,13vw,54px);height:clamp(42px,13vw,54px);font-size:clamp(19px,6vw,24px);color:#344064;background:#fff;border:1px solid rgba(60,70,120,.13);box-shadow:0 3px 9px rgba(30,40,90,.14)}
#wh .lt.on{background:linear-gradient(135deg,var(--wow-tile),#6048b8);color:#fff;box-shadow:0 0 20px var(--wow-glow)}
.wow-controls{display:flex;align-items:center;justify-content:center;gap:9px;flex:none;padding-top:2px}
.wow-controls .btn{min-width:0;min-height:44px;padding:9px 13px;font-size:13px;gap:6px;border-radius:16px;background:rgba(12,15,40,.24);border:1px solid rgba(255,255,255,.25);color:#fff;box-shadow:none}
.wow-controls .btn .i{width:17px;height:17px}
.wow-controls .btn span{white-space:nowrap}
.wow-controls .btn:active{background:rgba(255,255,255,.22)}
@media(max-height:720px){
 .wow-shell{gap:5px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
 .wow-board-card{padding:6px}
 .wow-grid{gap:3px;width:min(100%,310px,calc((100dvh - 405px)*var(--ratio)))}
 .wow-cell,.wow-blank{border-radius:5px}
 #wh{width:250px;height:250px}
 .wow-wheel-caption{display:none}
 .wow-controls .btn{min-height:40px;padding:7px 11px}
}
@media(max-width:360px){.wow-controls{gap:5px}.wow-controls .btn{padding:7px 9px;font-size:12px}.wow-grid{gap:2px}}
/* Ana sayfa oyun kartları: taşmayan, hizalı kart düzeni */
#car{display:grid;grid-template-columns:1fr;gap:10px;padding:4px 2px 14px;margin:0;overflow:visible;perspective:none}
#car .gc{width:100%;min-width:0;display:grid;grid-template-columns:66px minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:13px 15px;border-radius:22px;transform:none!important;opacity:1!important}
#car .gc .orb{grid-column:1;grid-row:1/3;width:62px;height:62px;margin:0}
#car .gc .orb::before{inset:-7px}
#car .gc .orb img{width:58px;height:58px}
#car .gc h3{grid-column:2;grid-row:1;align-self:end;font-size:16px}
#car .gc p{grid-column:2;grid-row:2;min-height:0;margin:2px 0 5px;font-size:12px}
#car .gc .rec{grid-column:2;grid-row:3;justify-self:start;font-size:11px;padding:4px 9px}
#car .gc.sel{box-shadow:0 0 0 1px var(--gc),var(--gsh)}
#pl{margin-top:0}

const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}};
const djb=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h};
const mkp=async(e,p)=>(await sha('nx:'+e+':'+p))||djb('nx:'+e+':'+p);
const okp=async(u,p)=>[await sha('nx:'+u.e+':'+p),await sha(p),djb('nx:'+u.e+':'+p),djb(p)].includes(u.p);
