# Bu dosya GitHub'da .github/workflows/build-apk.yml yoluna konmalı.
name: APK derle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini üret
        run: npx cap add android

      - name: Widget ve bildirim ayarlarını ekle
        run: node patch-android.js

      - name: Sürüm numarasını ayarla
        env:
          # Sürüm adındaki sayı = derleme sırası + SAYI_KAYDIR. İlk derlemede 1.0.12 çıkması için
          # bu sayıyı (12 - ilk derlemenin sırası) olarak ayarla. Sıra numarasını Actions listesinde "#N" olarak görürsün.
          SAYI_KAYDIR: "0"
          SURUM_SONEK: "Om"
        run: |
          N=$(( ${{ github.run_number }} + SAYI_KAYDIR ))
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${N} ${SURUM_SONEK}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Uygulama simgesi (depoda bir resim varsa)
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          ICON=$( [ -f icon.png ] && echo icon.png || ls *.png *.jpg *.jpeg *.PNG *.JPG *.JPEG 2>/dev/null | head -1)
          if [ -z "$ICON" ]; then
            echo "Simge resmi yok, varsayilan simge kullanilacak"
          else
            echo "Simge: $ICON"
            RES=android/app/src/main/res
            gen() {
              d=$1; s=$2; f=$3; p=$((f*66/100))
              mkdir -p "$RES/mipmap-$d"
              convert "$ICON" -resize "${s}x${s}^" -gravity center -extent "${s}x${s}" "$RES/mipmap-$d/ic_launcher.png"
              cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
              convert "$ICON" -resize "${p}x${p}^" -gravity center -extent "${p}x${p}" -background none -gravity center -extent "${f}x${f}" "$RES/mipmap-$d/ic_launcher_foreground.png"
            }
            gen mdpi 48 108
            gen hdpi 72 162
            gen xhdpi 96 216
            gen xxhdpi 144 324
            gen xxxhdpi 192 432
            # Arka plan rengi: resmin köşesinden alınır
            BG="#$(convert "$ICON" -format '%[hex:p{8,8}]' info: | cut -c1-6)"
            mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">%s</color>\n</resources>\n' "$BG" > "$RES/values/ic_launcher_background.xml"
            # Capacitor şablonunun varsayılan (vektör) simgesini sil ve uyarlanabilir simgeyi bizim resme yönlendir
            rm -f "$RES"/drawable-v24/ic_launcher_foreground.xml "$RES"/drawable/ic_launcher_background.xml "$RES"/drawable/ic_launcher_foreground.xml
            for n in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > "$RES/mipmap-anydpi-v26/$n.xml"
            done
            ls -R "$RES" | grep -i launcher
          fi

      - name: Sabit imza anahtarı (güncellemelerin üstüne kurulabilmesi için)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Sabit imza anahtarı kullanılıyor"
          else
            echo "UYARI: debug.keystore depoda yok, her derleme farklı imzalanır"
          fi

      - name: Capacitor senkronu
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Heartsync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Heartsync-APK
          path: Heartsync.apk

      - name: Release olarak yayınla (doğrudan indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Heartsync APK ${{ github.run_number }}
          files: Heartsync.apk
